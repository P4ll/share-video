[package]
name = "share-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

[dependencies]
axum = { version = "0.8", features = ["ws"] }
base64 = "0.22"
getrandom = "0.3"
mime = "0.3"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls-webpki-roots"] }
scraper = { version = "0.24", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tower-http = { version = "0.6", features = ["fs", "set-header"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
