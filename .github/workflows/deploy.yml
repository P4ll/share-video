name: Deploy Share Video

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: share-video-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build production image
        run: |
          docker build --target web-test .
          docker build --target server-test .
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "share-video:$GITHUB_SHA" .

      - name: Publish image and confirm rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_revision() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          }
          if [[ $(main_revision) != "$GITHUB_SHA" ]]; then
            echo 'This revision is no longer the tip of main; skipping deployment.'
            exit 0
          fi

          tag="deploy-$GITHUB_SHA"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            archive="$RUNNER_TEMP/share-video-image.tar.gz"
            docker image save "share-video:$GITHUB_SHA" | gzip -1 > "$archive"
            gh release create "$tag" "$archive" --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" --prerelease --latest=false \
              --title "Deploy ${GITHUB_SHA:0:12}" --notes "Production image for $GITHUB_SHA."
          fi

          for attempt in {1..30}; do
            if [[ $(curl -fsS --max-time 5 https://watch.avgtree.online/_revision 2>/dev/null || true) == "$GITHUB_SHA" ]]; then
              curl -fsS --max-time 5 https://watch.avgtree.online/api/health
              printf '\nDeployed `%s` to <https://watch.avgtree.online>.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ $(main_revision) != "$GITHUB_SHA" ]]; then
              echo 'A newer revision is ready to deploy.'
              exit 0
            fi
            sleep 5
          done
          echo 'The VPS did not report the expected revision.' >&2
          exit 1
