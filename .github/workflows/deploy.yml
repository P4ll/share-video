name: Deploy Share Video

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: share-video-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test and build production image
        run: |
          docker build --target web-test .
          docker build --target server-test .
          docker build \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --tag "share-video:$GITHUB_SHA" .

      - name: Deploy and check HTTPS
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_KEY: ${{ secrets.SHARE_VIDEO_DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.SHARE_VIDEO_KNOWN_HOSTS }}
        run: |
          latest=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ $GITHUB_SHA != "$latest" ]]; then
            echo 'This revision is no longer the tip of main; skipping deployment.'
            exit 0
          fi
          : "${DEPLOY_KEY:?Missing SHARE_VIDEO_DEPLOY_KEY}"
          : "${DEPLOY_KNOWN_HOSTS:?Missing SHARE_VIDEO_KNOWN_HOSTS}"
          umask 077
          ssh_dir=$(mktemp -d)
          trap 'rm -rf "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$ssh_dir/known_hosts"

          {
            printf '%s\n' "$GITHUB_SHA"
            docker image save "share-video:$GITHUB_SHA" | gzip -1
          } | ssh -T -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$ssh_dir/known_hosts" -o ConnectTimeout=15 \
            -i "$ssh_dir/key" share-video-deploy@watch.avgtree.online

          curl --silent --show-error --fail --retry 20 --retry-all-errors --retry-delay 3 \
            --max-time 6 --retry-max-time 90 https://watch.avgtree.online/api/health
          printf '\nDeployed `%s` to <https://watch.avgtree.online>.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
