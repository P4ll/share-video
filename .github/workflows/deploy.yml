name: Deploy Share Video

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: share-video-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test web and server
        run: |
          docker build --target web-test .
          docker build --target server-test .

      - name: Mark tested revision and confirm rollout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          main_revision() {
            gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha
          }
          if [[ $(main_revision) != "$GITHUB_SHA" ]]; then
            echo 'This revision is no longer the tip of main; skipping deployment.'
            exit 0
          fi

          # Only this job advances the deployment ref, after both test targets pass.
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "$GITHUB_SHA:refs/heads/deploy/production"

          for attempt in {1..75}; do
            if [[ $(curl -fsS --max-time 5 https://watch.avgtree.online/_revision 2>/dev/null || true) == "$GITHUB_SHA" ]]; then
              curl -fsS --max-time 5 https://watch.avgtree.online/api/health
              printf '\nDeployed `%s` to <https://watch.avgtree.online>.\n' "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ $(main_revision) != "$GITHUB_SHA" ]]; then
              echo 'A newer revision is now at the tip of main.'
              exit 0
            fi
            sleep 5
          done
          echo 'The VPS did not report the expected revision.' >&2
          exit 1
